appId: com.marckraw.backpack-studio
productName: Backpack Studio
directories:
  output: release
artifactName: Backpack-Studio-${version}-${arch}.${ext}
asar: true
npmRebuild: false
files:
  - package.json
  - out/**/*
mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
    - target: zip
publish:
  - provider: github
    owner: marckraw
    repo: backpack-studio
    releaseType: release
