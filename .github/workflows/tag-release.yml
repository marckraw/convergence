name: Tag Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve release tag state
        id: release
        run: |
          VERSION=$(node -p "require('./apps/convergence/package.json').version")
          TAG="v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The second condition covers the commit that introduced apps/convergence:
          # at HEAD^ the app package.json does not exist yet, and an unguarded
          # `git show` there pipes nothing into node, which exits non-zero and
          # fails the whole step under the runner's default `bash -e`.
          if git rev-parse HEAD^ >/dev/null 2>&1 \
            && git cat-file -e "HEAD^:apps/convergence/package.json" 2>/dev/null; then
            PREVIOUS_VERSION=$(
              git show HEAD^:apps/convergence/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))"
            )
          else
            PREVIOUS_VERSION=''
          fi

          if [ "$PREVIOUS_VERSION" = "$VERSION" ]; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.release.outputs.version_changed == 'true' && steps.release.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Trigger publish workflow
        if: steps.release.outputs.version_changed == 'true' && steps.release.outputs.tag_exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-mac-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f tag="${{ steps.release.outputs.tag }}"

      - name: Skip reason
        if: steps.release.outputs.version_changed != 'true' || steps.release.outputs.tag_exists == 'true'
        run: |
          echo "version_changed=${{ steps.release.outputs.version_changed }}"
          echo "tag_exists=${{ steps.release.outputs.tag_exists }}"
          echo "No release tag created for this push."
