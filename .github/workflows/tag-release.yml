name: Tag Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve release tag state
        id: release
        run: node tools/resolve-release-tag.mjs apps/convergence/package.json v

      - name: Create and push tag
        if: steps.release.outputs.version_changed == 'true' && steps.release.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Trigger publish workflow
        if: steps.release.outputs.version_changed == 'true' && steps.release.outputs.tag_exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-mac-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f tag="${{ steps.release.outputs.tag }}"

      - name: Skip reason
        if: steps.release.outputs.version_changed != 'true' || steps.release.outputs.tag_exists == 'true'
        run: |
          echo "version_changed=${{ steps.release.outputs.version_changed }}"
          echo "tag_exists=${{ steps.release.outputs.tag_exists }}"
          echo "No release tag created for this push."

      - name: Resolve Studio release tag state
        id: studio
        run: node tools/resolve-release-tag.mjs apps/backpack-studio/package.json studio-v

      - name: Create and push Studio tag
        if: steps.studio.outputs.version_changed == 'true' && steps.studio.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.studio.outputs.tag }}" -m "Release ${{ steps.studio.outputs.tag }}"
          git push origin "${{ steps.studio.outputs.tag }}"

      - name: Trigger Studio publish workflow
        if: steps.studio.outputs.version_changed == 'true' && steps.studio.outputs.tag_exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-studio-mac-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f tag="${{ steps.studio.outputs.tag }}"

      - name: Studio skip reason
        if: steps.studio.outputs.version_changed != 'true' || steps.studio.outputs.tag_exists == 'true'
        run: |
          echo "version_changed=${{ steps.studio.outputs.version_changed }}"
          echo "tag_exists=${{ steps.studio.outputs.tag_exists }}"
          echo "No release tag created for this push."
