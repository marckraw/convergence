name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@ef-global'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EF_GLOBAL_PACKAGES_TOKEN }}

      - name: Require changeset on PRs
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: npx changeset status --since=origin/master

      - name: Run pure tests
        run: npm run test:pure

      - name: Run unit tests
        run: npm run test:unit

      # The lane canary must run inside a process that carries Electron's asar
      # `fs` patch, which no vitest run does -- that gap is exactly how a lane
      # that could not be created passed four rounds of review (MAR-2814). The
      # `electron` binary needs a display even when it opens no window, so
      # `xvfb-run` provides one; `--node` runs the same bundle under plain Node,
      # and a run where both agree on a patched-fs regression would be a canary
      # that had stopped watching.
      - name: Run the lane canary under Electron
        run: xvfb-run -a npm run test:electron

      - name: Run the lane canary under plain Node
        run: npm run test:electron:node

      - name: Run performance counter budgets
        run: npm run test:perf

      # The repo pins Chaperone in scripts/chaperone.mjs (MAR-3609): it
      # downloads that release once, checks it against the release's
      # SHA256SUMS.txt, and runs it. CI, `npm run chaperone` and
      # `npm run agent:pre-push` all go through it, so they agree.
      - name: Run chaperone
        run: node scripts/chaperone.mjs check --fix

      - name: Run typecheck
        run: npm run typecheck

      # The second app and the shared package build on every PR, cheaply
      # (MAR-2737). Convergence's own build is deliberately still absent here:
      # it needs `electron-rebuild` of better-sqlite3 and node-pty, which is why
      # it has never been a CI step. Backpack Studio has no native module, so its
      # build is seconds -- and it is the one thing that proves the extraction is
      # consumable from a second app rather than merely typecheckable.
      #
      # No mac packaging in CI, and no publish for Studio: its identity and
      # signing are its constitution's to rule (MAR-2705).
      - name: Build Backpack Studio
        run: npm run build -w backpack-studio

  # Every check, run against a fixture that breaks it on purpose (MAR-3612):
  # a check that stopped firing looks exactly like one with nothing to report,
  # so this job fails when one stays silent or has no canary. Not the Electron
  # lane canary above, which tests the app rather than a check.
  canaries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@ef-global'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EF_GLOBAL_PACKAGES_TOKEN }}

      - name: Run the scripts' tests
        run: npm run test:scripts

      - name: Run the canaries
        run: npm run canaries
