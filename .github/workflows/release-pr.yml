name: Release PR

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

# One queue per ref: two master merges in quick succession must not race
# their changesets pushes — cancel-in-progress stays false so the older
# run is never cancelled mid-push; runs queue and the last push reflects
# the newest master.
concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changesets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@ef-global'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EF_GLOBAL_PACKAGES_TOKEN }}

      - name: Create or update release PR
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
